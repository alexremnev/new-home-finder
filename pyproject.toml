[project]
name = "new-home-finder"
version = "0.1.0"
description = "Cross-portal London rental monitor with schema-driven, self-healing extraction"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "curl-cffi>=0.7",        # TLS/JA3 impersonation; see spec, anti-bot section
    "selectolax>=0.3.21",    # fast HTML parsing for the dom extraction strategy
    "jsonpath-ng>=1.6",      # json_path / next_data / api_json strategies
    "psycopg[binary]>=3.2",
    "anthropic>=0.40",       # AI schema inference (Haiku 4.5)
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# The MTProto reader only. A host that scrapes has no business installing a
# Telegram client, and the base install stays the same size for it.
ingest = [
    "telethon>=1.36,<2",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "mypy>=1.13",
    "ruff>=0.8",
    "requests>=2.32",        # probe script baseline profile only
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.ruff]
line-length = 100
target-version = "py312"
# tools/ holds standalone utilities with their own requirements.txt and their own
# virtualenv. Checking them from here would mean resolving dependencies this
# project does not install, which is exactly the coupling keeping them separate
# avoids.
exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = "^tools/"

[[tool.mypy.overrides]]
module = ["selectolax.*", "jsonpath_ng.*", "curl_cffi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
