[project]
name = "new-home-finder"
version = "0.1.0"
description = "Cross-portal London rental monitor with schema-driven, self-healing extraction"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# The MTProto reader only. A host that scrapes has no business installing a
# Telegram client, and the base install stays the same size for it.
ingest = [
    "telethon>=1.36,<2",
]
# Reading the portals' own pages. curl_cffi rather than requests or httpx
# because the block is on the TLS and HTTP/2 fingerprint: measured on
# 26 September 2026, Rightmove answers urllib 403 under any User-Agent and
# answers curl_cffi 200 from the same address, once the handshake looks like
# Chrome's. It is also what gives us the wire byte count that residential proxy
# billing has to be checked against. See worker/sources/fetch.py.
scrape = [
    "curl_cffi>=0.7",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "mypy>=1.13",
    "ruff>=0.8",
    # The scraper's tests read a saved page, but they import its transport.
    "curl_cffi>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.ruff]
line-length = 100
target-version = "py312"
# tools/ holds standalone utilities with their own requirements.txt and their own
# virtualenv. Checking them from here would mean resolving dependencies this
# project does not install, which is exactly the coupling keeping them separate
# avoids.
exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = "^tools/"


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
